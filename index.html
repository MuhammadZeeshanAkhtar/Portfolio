    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />

    <!-- Open Graph -->

    <meta property="og:site_name" content="Muhammad Zeeshan Akhtar" />

    <!-- Hero photo (largest contentful paint). Must match the <img> srcset/sizes in src/sections/Hero.tsx. -->
    <link
      rel="preload"
      as="image"
      type="image/webp"
      href="./assets/zeeshan-480.webp"
      imagesrcset="./assets/zeeshan-480.webp 480w, ./assets/zeeshan-720.webp 720w"
      imagesizes="(min-width: 1024px) 400px, 352px"
      fetchpriority="high"
    />

    <!-- Apply the saved theme before first paint. Storage may be blocked, so guard every access. -->
    <script>
      (function () {
        var theme = null;
        try {
          theme = window.localStorage.getItem('mza-theme');
        } catch (e) {}
        var dark =
          theme === 'dark' ||
          (theme !== 'light' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
        if (dark) document.documentElement.classList.add('dark');
      })();
    </script>
  </head>
